# Supabase local configuration for Ops Core
# Config reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "ntv-ops-core"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Match your hosted Supabase Postgres major version when you link later.
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Keep disabled until we intentionally add supabase/seed.sql
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Angular dev server default
site_url = "http://127.0.0.1:4200"
additional_redirect_urls = [
  "http://127.0.0.1:4200",
  "http://localhost:4200",
  "http://127.0.0.1:4000",
  "http://localhost:4000"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
# Keep disabled for MVP (less containers/CPU). Turn on later if needed.
enabled = false
port = 54327
backend = "postgres"